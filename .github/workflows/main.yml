name: Build Android TV APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f StreamHubTV_Final.zip ]; then unzip -o StreamHubTV_Final.zip; fi
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - working-directory: StreamHubTV
        run: |
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY || secrets.IMDB }}" >> local.properties
          echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY || secrets.YOUTUBE }}" >> local.properties
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: StreamHubTV-APK
          path: StreamHubTV/app/build/outputs/apk/debug/app-debug.apk
