name: Build Android TV APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StreamHubTV
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: |
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY || secrets.IMDB }}" >> local.properties
          echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY || secrets.YOUTUBE }}" >> local.properties
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: StreamHubTV-APK
          path: StreamHubTV/app/build/outputs/apk/debug/app-debug.apk
          
